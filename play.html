<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steam 发车雷达</title>
<link rel="manifest" href="/play-manifest.json">
<link rel="icon" href="/icons/icon48.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900;950&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f7fc;
  --card: #ffffff;
  --surface: #f8fafc;
  --brand-primary: #ff5e62;
  --brand-secondary: #3b82f6;
  --brand-success: #10b981;
  --brand-yellow: #fbc531;
  --brand-purple: #8c7ae6;
  --text: #1e293b;
  --text-dim: #64748b;
  --text-muted: #94a3b8;
  --border-thick: #0f172a;
  --danger: #ef4444;
  --shadow-sm: 2px 2px 0px var(--border-thick);
  --shadow-bento: 6px 6px 0px var(--border-thick);
  --shadow-btn: 4px 4px 0px var(--border-thick);
  --shadow-pop: 8px 8px 0px var(--border-thick);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--bg);
  background-image: radial-gradient(rgba(15, 23, 42, 0.08) 2px, transparent 2px);
  background-size: 28px 28px;
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 80px;
}

.app-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
}

.topnav {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 16px;
  margin-bottom: 12px;
  padding-bottom: 14px;
  border-bottom: 2px dashed #cbd5e1;
}

.topnav-left {
  display: flex;
  align-items: center;
  min-width: 0;
  justify-self: start;
}

.topnav h1 {
  font-size: clamp(20px, 2.4vw, 26px);
  font-weight: 900;
  color: var(--border-thick);
  letter-spacing: -0.5px;
  white-space: nowrap;
  justify-self: center;
}

.topnav-right {
  flex-shrink: 0;
  justify-self: end;
}

.back-link {
  display: inline-flex;
  align-items: center;
  padding: 8px 12px;
  border: 2.5px solid var(--border-thick);
  border-radius: 12px;
  background: #fff;
  box-shadow: 2px 2px 0px var(--border-thick);
  font-size: 13px;
  font-weight: 800;
  color: var(--border-thick);
  text-decoration: none;
  transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1);
}

.back-link:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0px var(--border-thick); }

.header-desc {
  grid-column: 1 / -1;
  text-align: center;
  font-size: 14px;
  color: var(--text-dim);
  max-width: 640px;
  margin: 2px auto 0;
  font-weight: 600;
  line-height: 1.5;
}

.auth-area {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  flex-wrap: wrap;
}

.user-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 5px 12px 5px 5px;
  background: #fff;
  border: 2.5px solid var(--border-thick);
  border-radius: 100px;
  box-shadow: 2px 2px 0px var(--border-thick);
}

.user-status-pill img {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid var(--border-thick);
  flex-shrink: 0;
  object-fit: cover;
  background: var(--surface);
}

.usp-info {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
  min-width: 0;
}

.usp-info .name {
  font-weight: 900;
  color: var(--border-thick);
  font-size: 14px;
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.usp-info .sub {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-dim);
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.user-status-pill .logout {
  font-size: 12px;
  font-weight: 800;
  color: var(--text-dim);
  text-decoration: none;
  border-left: 2px dashed #cbd5e1;
  padding-left: 10px;
}

.user-status-pill .logout:hover { color: var(--danger); }

.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--brand-success);
  border: 2px solid var(--border-thick);
  flex-shrink: 0;
}

.status-dot.off { background: var(--text-muted); }

.game-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--brand-yellow);
  border: 2px solid var(--border-thick);
  border-radius: 10px;
  padding: 3px 8px;
  font-size: 12px;
  font-weight: 800;
  color: var(--border-thick);
  white-space: nowrap;
}

.auth-login-group {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

.toolbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.toolbar-cta { flex-shrink: 0; }

.toolbar-cta-group {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.presence-switch {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: #fff;
  border: 2.5px solid var(--border-thick);
  border-radius: 14px;
  box-shadow: 2px 2px 0px var(--border-thick);
  cursor: pointer;
  font-size: 13px;
  font-weight: 800;
  color: var(--border-thick);
  user-select: none;
}

.presence-switch input { display: none; }

.switch-track {
  width: 34px;
  height: 20px;
  border: 2px solid var(--border-thick);
  border-radius: 100px;
  background: #e2e8f0;
  position: relative;
  transition: background 0.15s ease;
  flex-shrink: 0;
}

.switch-thumb {
  position: absolute;
  top: 1px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  border: 1.5px solid var(--border-thick);
  transition: transform 0.15s ease;
}

.presence-switch input:checked + .switch-track { background: var(--brand-success); }
.presence-switch input:checked + .switch-track .switch-thumb { transform: translateX(14px); }

.btn {
  padding: 16px 30px;
  border: 3px solid var(--border-thick);
  border-radius: 16px;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn:focus-visible,
.btn-tiny:focus-visible,
.room-close:focus-visible {
  outline: 3px solid var(--brand-secondary);
  outline-offset: 2px;
}

.btn-primary {
  background: var(--brand-primary);
  color: #fff;
  box-shadow: var(--shadow-btn);
}

.btn-primary:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--border-thick); }
.btn-primary:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--border-thick); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

.btn-ghost {
  background: #ffffff;
  color: var(--border-thick);
  box-shadow: 3px 3px 0px var(--border-thick);
}

.btn-ghost:hover { background: var(--surface); transform: translate(-1px, -1px); box-shadow: 4px 4px 0px var(--border-thick); }

.btn-match {
  background: var(--brand-secondary);
  color: #fff;
  box-shadow: var(--shadow-btn);
}

.btn-match:hover { background: #2b5fd9; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--border-thick); }
.btn-match:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--border-thick); }
.btn-match:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

.filter-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 26px;
  padding: 12px 16px;
  background: #fff8e1;
  border: 2.5px dashed var(--border-thick);
  border-radius: 14px;
  font-size: 13px;
  font-weight: 800;
  color: var(--border-thick);
}

.filter-bar.hidden { display: none; }

.lobby-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 18px;
}

.lobby-card {
  background: var(--card);
  border: 3px solid var(--border-thick);
  border-radius: 24px 24px 24px 14px;
  padding: 22px 24px;
  box-shadow: 5px 5px 0px var(--border-thick);
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: flex;
  flex-direction: column;
}

.lobby-card:hover {
  transform: translate(-5px, -5px);
  box-shadow: 10px 10px 0px var(--brand-purple);
}

.lobby-card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
}

.lobby-game { font-size: 18px; font-weight: 900; color: var(--border-thick); overflow-wrap: anywhere; }

.lobby-count {
  flex-shrink: 0;
  font-size: 12px;
  font-weight: 900;
  padding: 6px 12px;
  border-radius: 100px;
  border: 2.5px solid var(--border-thick);
}

.lobby-count.open { background: #e7f9f0; color: #0b7a52; }
.lobby-count.full { background: #ffe4e4; color: var(--danger); }

.lobby-time { font-size: 13px; color: var(--text-dim); font-weight: 700; margin-bottom: 12px; }

.lobby-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }

.lobby-tag {
  font-size: 11px;
  font-weight: 800;
  background: var(--surface);
  border: 2px solid var(--border-thick);
  border-radius: 8px;
  padding: 3px 8px;
  color: var(--text-dim);
}

.lobby-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 14px;
  border-top: 2.5px dashed #cbd5e1;
  margin-top: auto;
}

.lobby-host { display: flex; align-items: center; gap: 10px; min-width: 0; }

.lobby-host img {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: 2px solid var(--border-thick);
  flex-shrink: 0;
  object-fit: cover;
  background: var(--surface);
}

.lobby-host .host-name {
  font-size: 13px;
  font-weight: 800;
  color: var(--text-dim);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.lobby-host .host-label { font-size: 11px; color: var(--text-muted); font-weight: 700; }

.online-section {
  margin-bottom: 18px;
  background: var(--card);
  border: 3px solid var(--border-thick);
  border-radius: 16px;
  padding: 10px 14px;
  box-shadow: var(--shadow-sm);
}

.online-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}

.online-head h3 { font-size: 13px; font-weight: 900; color: var(--border-thick); }

.online-count {
  font-size: 11px;
  font-weight: 900;
  color: var(--text-dim);
  background: var(--surface);
  border: 2px solid var(--border-thick);
  border-radius: 100px;
  padding: 3px 9px;
}

.online-empty { font-size: 12px; color: var(--text-muted); font-weight: 700; padding: 4px 0; }

.online-list { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 10px; padding-bottom: 4px; }

.online-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border: 2.5px solid var(--border-thick);
  border-radius: 14px;
  padding: 7px 10px;
  box-shadow: 2px 2px 0px var(--border-thick);
  font-size: 13px;
  font-weight: 800;
  color: var(--border-thick);
  transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1);
}

.online-chip:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0px var(--border-thick); background: #fff; }

.online-chip img {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  border: 2px solid var(--border-thick);
  object-fit: cover;
  background: #fff;
}

.online-chip .chip-name {
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.online-chip .chip-game {
  color: var(--brand-secondary);
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 50;
}

.modal-overlay.hidden { display: none; }

.modal {
  background: #fff;
  border: 3px solid var(--border-thick);
  border-radius: 28px 28px 28px 16px;
  box-shadow: var(--shadow-pop);
  padding: 28px;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

.modal.wide { max-width: 560px; }

.modal h3 { font-size: 20px; font-weight: 900; color: var(--border-thick); margin-bottom: 6px; }
.modal .sub { font-size: 13px; color: var(--text-dim); font-weight: 600; margin-bottom: 20px; }

@keyframes popIn {
  from { opacity: 0; transform: scale(0.95) translateY(15px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.field { margin-bottom: 16px; }

.field label {
  display: block;
  font-size: 13px;
  font-weight: 900;
  color: var(--border-thick);
  margin-bottom: 8px;
}

.field input,
.field select {
  width: 100%;
  padding: 14px 16px;
  border: 3px solid var(--border-thick);
  border-radius: 14px;
  font-size: 15px;
  font-weight: 700;
  background: #fff;
  color: var(--text);
  transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1);
}

.field input::placeholder { color: var(--text-muted); }

.field input:focus,
.field select:focus {
  outline: none;
  box-shadow: 4px 4px 0px var(--brand-secondary);
  transform: translate(-1px, -1px);
}

.field .hint { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 6px; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }

.room-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  padding-bottom: 18px;
  margin-bottom: 18px;
  border-bottom: 3px dashed #cbd5e1;
}

.room-title { font-size: 22px; font-weight: 900; color: var(--border-thick); }
.room-meta { font-size: 13px; color: var(--text-dim); font-weight: 700; margin-top: 4px; }

.room-close {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  border: 2.5px solid var(--border-thick);
  border-radius: 10px;
  background: #fff;
  color: var(--border-thick);
  font-weight: 900;
  cursor: pointer;
}

.room-close:hover { background: var(--surface); }

.board {
  background: var(--surface);
  border: 2.5px solid var(--border-thick);
  border-radius: 16px;
  padding: 16px 18px;
  margin-bottom: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.board-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; }
.board-row .k { color: var(--text-dim); font-weight: 700; flex-shrink: 0; }
.board-row code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--brand-secondary);
  font-weight: 800;
  word-break: break-all;
  text-align: right;
}
.board-row a { color: var(--brand-success); font-weight: 800; text-decoration: none; }
.board-row a:hover { text-decoration: underline; }

.section-title { font-size: 13px; font-weight: 900; color: var(--border-thick); margin-bottom: 10px; }

.member-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

.member-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: #fff;
  border: 2.5px solid var(--border-thick);
  border-radius: 16px;
  box-shadow: 3px 3px 0px var(--border-thick);
}

.member-item img {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  border: 2px solid var(--border-thick);
  flex-shrink: 0;
  object-fit: cover;
  background: var(--surface);
}

.member-item .m-name {
  flex: 1;
  min-width: 0;
  font-size: 14px;
  font-weight: 800;
  color: var(--border-thick);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.member-actions { display: flex; gap: 8px; flex-shrink: 0; }

.btn-tiny {
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 800;
  border: 2.5px solid var(--border-thick);
  border-radius: 10px;
  cursor: pointer;
  background: #fff;
  color: var(--border-thick);
  text-decoration: none;
  box-shadow: 2px 2px 0px var(--border-thick);
  transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.btn-tiny:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0px var(--border-thick); }
.btn-tiny.danger:hover { background: var(--danger); color: #fff; }

.room-actions { display: flex; gap: 12px; }
.room-actions .btn { width: 100%; }

.status-pill {
  width: 100%;
  text-align: center;
  padding: 14px;
  font-size: 14px;
  font-weight: 900;
  border: 3px solid var(--border-thick);
  border-radius: 16px;
}

.status-pill.full { background: #ffe4e4; color: var(--danger); }
.status-pill.joined { background: #e7f9f0; color: #0b7a52; }

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 20px;
  background: var(--card);
  border: 3px dashed var(--border-thick);
  border-radius: 32px 32px 32px 16px;
}

.empty p { font-size: 17px; font-weight: 800; color: var(--text-dim); }

.toast {
  position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
  padding: 14px 28px; background: var(--border-thick); color: #fff;
  border-radius: 16px; font-weight: 800; font-size: 14px;
  border: 3px solid var(--border-thick);
  box-shadow: 8px 8px 0px rgba(0,0,0,0.12);
  z-index: 9999; opacity: 0; transition: opacity 0.3s ease;
  pointer-events: none;
}

.toast.show { opacity: 1; }

@media (max-width: 900px) {
  .app-container { padding: 20px 16px; }
}

@media (max-width: 640px) {
  body { padding-bottom: 60px; }
  .app-container { padding: 16px 12px; }
  .topnav { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .topnav h1 { align-self: center; }
  .topnav-right { width: 100%; }
  .auth-area { justify-content: flex-start; }
  .header-desc { font-size: 13px; margin: 2px auto 0; align-self: center; }
  .toolbar { flex-direction: column; align-items: stretch; gap: 10px; }
  .toolbar-cta-group {
    order: -1;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .toolbar-cta-group .btn { width: 100%; }
  .toolbar-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .toolbar-actions .btn { width: 100%; }
  .toolbar-actions .presence-switch { grid-column: 1 / -1; justify-content: center; }
  .lobby-card { padding: 20px 18px 16px; }
  .lobby-game { font-size: 17px; }
  .lobby-foot { flex-wrap: wrap; }
  .online-section { padding: 10px 12px; }
  .online-chip { flex-shrink: 0; }
  .online-chip .chip-game { margin-left: auto; }
  .form-row { grid-template-columns: 1fr; }
  .modal { padding: 22px; }
  .modal-actions { flex-direction: column-reverse; }
  .modal-actions .btn { width: 100%; }
  .board-row { flex-direction: column; align-items: flex-start; gap: 6px; }
  .board-row code { text-align: left; }
  .member-item { flex-wrap: wrap; }
  .room-actions { flex-direction: column; }
}
</style>

<style id="ui-optimization-v2">
/* ===== Steam 发车雷达 · UI Optimization v2 ===== */
:root {
  --bg: #f5f7fb;
  --surface: #f8fafc;
  --card: #ffffff;
  --border-thick: #111827;
  --text: #172033;
  --text-dim: #64748b;
  --text-muted: #94a3b8;
  --brand-primary: #ff5b63;
  --brand-secondary: #3b82f6;
  --brand-success: #13b981;
  --brand-yellow: #ffd45a;
  --brand-purple: #8b7cf6;
  --line: #d8e0eb;
  --shadow-sm: 3px 3px 0 var(--border-thick);
  --shadow-btn: 4px 4px 0 var(--border-thick);
  --shadow-pop: 8px 8px 0 var(--border-thick);
}

body {
  background-color: var(--bg);
  background-image:
    radial-gradient(circle, rgba(17,24,39,.09) 1.5px, transparent 1.5px),
    linear-gradient(180deg, rgba(255,255,255,.55), transparent 240px);
  background-size: 28px 28px, 100% 100%;
  color: var(--text);
}

.app-container {
  max-width: 1320px;
  padding: 22px 28px 72px;
}

/* Header */
.topnav {
  position: relative;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  min-height: 82px;
  align-items: center;
  gap: 20px;
  margin-bottom: 8px;
  padding: 0 0 16px;
  border-bottom: 2px solid var(--line);
}

.topnav h1 {
  font-size: clamp(24px, 2.2vw, 30px);
  letter-spacing: -1px;
}

.back-link {
  padding: 9px 14px;
  border-radius: 13px;
  box-shadow: 3px 3px 0 var(--border-thick);
  background: #fff;
}

.back-link:hover {
  background: #f8fafc;
  transform: translate(-2px,-2px);
  box-shadow: 5px 5px 0 var(--border-thick);
}

.header-desc {
  grid-column: 1 / -1;
  margin: -2px auto 2px;
  max-width: 760px;
  font-size: 13px;
  line-height: 1.55;
  color: #718096;
}

/* User area */
.user-status-pill {
  padding: 5px 10px 5px 5px;
  box-shadow: 3px 3px 0 var(--border-thick);
}

.user-status-pill img {
  width: 32px;
  height: 32px;
}

.game-tag {
  background: var(--brand-yellow);
  border-radius: 9px;
}

/* Main controls: turn the loose buttons into a compact control bar */
.toolbar {
  margin: 22px 0 14px;
  padding: 12px;
  border: 2.5px solid var(--border-thick);
  border-radius: 18px;
  background: rgba(255,255,255,.9);
  box-shadow: 4px 4px 0 var(--border-thick);
  gap: 12px;
}

.toolbar-actions,
.toolbar-cta-group {
  gap: 8px;
}

.toolbar-actions .btn,
.toolbar-cta-group .btn {
  min-height: 46px;
}

.btn {
  min-height: 46px;
  padding: 12px 18px;
  border-radius: 13px;
  font-size: 14px;
}

.btn-ghost {
  box-shadow: 3px 3px 0 var(--border-thick);
}

.btn-primary,
.btn-match {
  box-shadow: var(--shadow-btn);
}

.toolbar-cta {
  min-width: 148px;
}

.btn-match {
  min-width: 124px;
}

.presence-switch {
  min-height: 46px;
  padding: 10px 13px;
  border-radius: 13px;
  box-shadow: 3px 3px 0 var(--border-thick);
}

/* Filter */
.filter-bar {
  justify-content: flex-start;
  min-height: 44px;
  margin: 0 0 14px;
  padding: 9px 13px;
  border: 2px dashed #9aa8bb;
  border-radius: 13px;
  background: #fff9e8;
  color: #475569;
}

/* Online section becomes a slim horizontal status strip */
.online-section {
  margin-bottom: 16px;
  padding: 11px 14px;
  border: 2.5px solid var(--border-thick);
  border-radius: 15px;
  box-shadow: var(--shadow-sm);
}

.online-head {
  margin-bottom: 7px;
}

.online-list {
  gap: 8px;
  scrollbar-width: thin;
}

.online-chip {
  padding: 6px 9px;
  border-radius: 12px;
  box-shadow: 2px 2px 0 var(--border-thick);
}

/* Lobby area */
#lobby-list {
  position: relative;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 16px;
  align-items: stretch;
  padding-top: 38px;
}

#lobby-list::before {
  content: "发车大厅";
  position: absolute;
  top: 0;
  left: 2px;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: -.4px;
  color: var(--border-thick);
}

#lobby-list::after {
  content: "选择一个车队即可查看房间详情";
  position: absolute;
  top: 4px;
  right: 2px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
}

.lobby-card {
  min-height: 206px;
  padding: 18px 19px 16px;
  border: 2.5px solid var(--border-thick);
  border-radius: 19px 19px 19px 12px;
  box-shadow: 4px 4px 0 var(--border-thick);
  cursor: pointer;
}

.lobby-card:hover {
  transform: translate(-3px,-3px);
  box-shadow: 7px 7px 0 var(--brand-purple);
}

.lobby-game {
  font-size: 17px;
  line-height: 1.25;
}

.lobby-count {
  padding: 5px 10px;
  border-width: 2px;
}

.lobby-time {
  margin-bottom: 10px;
  font-size: 12px;
}

.lobby-tags {
  margin-bottom: 12px;
}

.lobby-tag {
  border-width: 1.5px;
  border-radius: 7px;
  padding: 3px 7px;
}

.lobby-foot {
  padding-top: 11px;
  border-top: 1.5px dashed var(--line);
}

.lobby-host img {
  width: 29px;
  height: 29px;
}

.lobby-host .host-name {
  font-size: 12px;
}

/* Empty state */
.empty {
  padding: 54px 20px;
  border-width: 2.5px;
  border-radius: 22px 22px 22px 13px;
}

/* Modals */
.modal {
  border-width: 2.5px;
  border-radius: 22px 22px 22px 14px;
  padding: 24px;
  box-shadow: 10px 10px 0 rgba(17,24,39,.9);
}

.modal h3 {
  font-size: 19px;
}

.field input,
.field select {
  padding: 12px 14px;
  border-width: 2.5px;
  border-radius: 12px;
}

.modal-actions {
  margin-top: 20px;
}

/* Toast */
.toast {
  bottom: 28px;
  padding: 12px 20px;
  border-width: 2px;
  border-radius: 12px;
}

.check-line {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 800;
  color: var(--border-thick);
  cursor: pointer;
  user-select: none;
}

.check-line input {
  width: 16px;
  height: 16px;
  accent-color: var(--brand-secondary);
  cursor: pointer;
}

/* Tablet */
@media (max-width: 900px) {
  .app-container { padding: 18px 18px 60px; }
  .toolbar { align-items: stretch; }
  .toolbar-actions { flex: 1 1 auto; }
  .toolbar-cta-group { flex: 0 0 auto; }
  #lobby-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* Mobile */
@media (max-width: 640px) {
  .app-container { padding: 12px 12px 52px; }

  .topnav {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 10px;
    min-height: 0;
    padding-bottom: 13px;
  }

  .topnav-left { grid-column: 1; }
  .topnav h1 {
    grid-column: 2;
    justify-self: end;
    align-self: center;
    font-size: 21px;
  }
  .topnav-right {
    grid-column: 1 / -1;
    width: 100%;
  }
  .auth-area { justify-content: space-between; }
  .header-desc {
    grid-column: 1 / -1;
    font-size: 12px;
    text-align: left;
    margin-top: 2px;
  }

  .toolbar {
    display: flex;
    flex-direction: column;
    padding: 9px;
    border-radius: 15px;
  }

  .toolbar-actions,
  .toolbar-cta-group {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .toolbar-actions .presence-switch {
    grid-column: 1 / -1;
    justify-content: center;
  }

  .toolbar-cta-group {
    order: -1;
  }

  .toolbar-cta-group .btn {
    width: 100%;
  }

  #lobby-list {
    grid-template-columns: 1fr;
    padding-top: 34px;
  }

  #lobby-list::after {
    display: none;
  }

  .lobby-card {
    min-height: 190px;
  }
}
</style>

</head>
<body>
<div class="app-container">

  <header class="topnav">
    <div class="topnav-left">
      <a href="/" class="back-link">← 返回</a>
    </div>
    <h1>Steam 发车雷达</h1>
    <div class="topnav-right">
      <div id="auth-section" class="auth-area"></div>
    </div>
    <p class="header-desc">Steam 官方一键登录，秒级集结开黑车队。发车、上车、桌面实时提醒，一键拉起 Steam 加好友。</p>
  </header>

  <div class="toolbar">
    <div class="toolbar-actions">
      <button id="refresh-btn" onclick="fetchLobbies()" class="btn btn-ghost">刷新大厅</button>
      <button onclick="openPushModal()" class="btn btn-ghost">桌面通知设置</button>
      <label class="presence-switch" title="开启后其他人可看到你正在玩的游戏">
        <input type="checkbox" id="presence-toggle" onchange="togglePresence()">
        <span class="switch-track"><span class="switch-thumb"></span></span>
        <span>共享在线状态</span>
      </label>
    </div>
    <div class="toolbar-cta-group">
      <button id="smart-match-btn" onclick="smartMatch()" class="btn btn-match">智能匹配</button>
      <button onclick="openCreateModal()" class="btn btn-primary toolbar-cta">发起车队 (发车)</button>
    </div>
  </div>

  <div id="game-filter-bar" class="filter-bar hidden"></div>
  <div id="online-section" class="online-section"></div>

  <div id="lobby-list" class="lobby-grid"></div>

</div>

<div id="create-modal" class="modal-overlay hidden">
  <div class="modal">
    <h3>发起开黑车队</h3>
    <p class="sub">填写车队信息，队友上车后你会实时收到提醒。</p>
    <div class="field">
      <label>游戏名称</label>
      <input id="create-game" type="text" placeholder="如：怪猎荒野 / 幻兽帕鲁 / 绝地潜兵2">
    </div>
    <div class="form-row">
      <div class="field">
        <label>所需总人数</label>
        <select id="create-max-players">
          <option value="2">2 人 (双人成行等)</option>
          <option value="4" selected>4 人标准车队</option>
          <option value="6">6 人车队</option>
        </select>
      </div>
      <div class="field">
        <label>发车时间</label>
        <input id="create-time" type="text" placeholder="立刻 / 今晚8点">
      </div>
    </div>
    <div class="field">
      <label>联机房间码 / 自建服 IP / 游戏id等（选填，加入后可见）</label>
      <input id="create-code" type="text" placeholder="如：8848 或 123.45.67.89:7777">
    </div>
    <div class="field">
      <label>语音频道链接（选填）</label>
      <input id="create-voice" type="text" placeholder="https://kook.top/...">
    </div>
    <div class="field">
      <label class="check-line">
        <input type="checkbox" id="create-require-approval">
        需要房主同意才能加入
      </label>
    </div>
    <div class="modal-actions">
      <button onclick="closeModal('create-modal')" class="btn btn-ghost">取消</button>
      <button onclick="submitCreate()" class="btn btn-primary">确认发车</button>
    </div>
  </div>
</div>

<div id="room-modal" class="modal-overlay hidden">
  <div id="room-detail" class="modal wide"></div>
</div>

<div id="push-modal" class="modal-overlay hidden">
  <div class="modal">
    <h3>桌面通知设置</h3>
    <p class="sub">车队满员或有新队友加入时，右下角秒级弹窗提醒。</p>
    <div class="field">
      <label>1. 授权桌面弹窗</label>
      <button onclick="enableWebPush()" class="btn btn-ghost" style="width:100%;">授权开启本电脑桌面弹窗</button>
      <div class="hint">授权后浏览器会把订阅保存到服务器，无需额外保存。</div>
    </div>
    <div class="field">
      <label>2. 发送测试通知</label>
      <button onclick="sendTestPush()" class="btn btn-ghost" style="width:100%;">发送一条测试通知</button>
      <div class="hint">点一下，验证推送链路能否正常弹出到桌面右下角。</div>
    </div>
    <div class="modal-actions">
      <button onclick="closeModal('push-modal')" class="btn btn-primary">关闭</button>
    </div>
  </div>
</div>

<div id="match-modal" class="modal-overlay hidden">
  <div class="modal wide">
    <h3>智能匹配</h3>
    <p class="sub" id="match-sub">正在读取当前游戏…</p>
    <div id="match-result"></div>
    <div class="modal-actions">
      <button onclick="closeModal('match-modal')" class="btn btn-primary">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="lobby-toast"></div>

<script src="/play.js"></script>
</body>
</html>
